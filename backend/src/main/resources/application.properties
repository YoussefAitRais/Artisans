spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/artisan
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true

#JWT
jwt.secret=ZHVtbXlfc2VjcmV0X2tleV93aXRoX3ZlcnlfbG9uZ19zdHJpbmc=
jwt.expiration=86400000


app.cors.allowed-origins=http://localhost:4200
server.port=8091


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.media.root=uploads


server.error.include-message=always
server.error.include-exception=true
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Admin User Seeding Configuration
# These values will be used to create an admin user automatically on startup
app.admin.seed.enabled=true
app.admin.email=admin@artisan.com
app.admin.password=admin123
app.admin.firstname=Admin
app.admin.lastname=System

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Make the UI load your spec explicitly
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.cache.disabled=true

