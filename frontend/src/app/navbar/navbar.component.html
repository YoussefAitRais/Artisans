<!-- Enhanced Responsive Navbar with Interactive Mobile Menu -->
<div class="fixed top-0 left-0 right-0 w-full bg-[#111827]/95 backdrop-blur-md border-b border-white/10 z-50 transition-all duration-300">
  <!-- Mobile Menu Overlay -->
  <div *ngIf="isMenuOpen()" 
       (click)="closeMenu()"
       class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 lg:hidden transition-opacity duration-300"></div>
       
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-50">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <!-- Logo Section -->
      <button class="flex items-center space-x-3 group" (click)="closeMenu()">
        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-gradient-to-r from-pink-600 to-pink-700 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-xl transition-all duration-200 transform group-hover:scale-105">
          <span class="text-white font-bold text-lg lg:text-xl">H</span>
        </div>
        <h2 class="text-white font-bold text-xl lg:text-2xl xl:text-3xl">Herfa</h2>
      </button>
      
      <!-- Desktop Navigation -->
      <div class="hidden lg:block">
        <ul class="flex items-center space-x-6 xl:space-x-8">
          <li class="relative group">
            <a routerLink="" 
               class="text-white/80 hover:text-white font-medium text-base xl:text-lg transition-colors duration-200 py-2 px-1">
              Home
            </a>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-pink-500 to-pink-600 group-hover:w-full transition-all duration-300"></div>
          </li>
          <li class="relative group">
            <a href="#" 
               class="text-white/80 hover:text-white font-medium text-base xl:text-lg transition-colors duration-200 py-2 px-1">
              About
            </a>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-pink-500 to-pink-600 group-hover:w-full transition-all duration-300"></div>
          </li>
          <li class="relative group">
            <a routerLink="/categories" 
               class="text-white/80 hover:text-white font-medium text-base xl:text-lg transition-colors duration-200 py-2 px-1">
              Categories
            </a>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-pink-500 to-pink-600 group-hover:w-full transition-all duration-300"></div>
          </li>
          <li class="relative group">
            <a routerLink="/register" 
               class="text-white/80 hover:text-white font-medium text-base xl:text-lg transition-colors duration-200 py-2 px-1">
              Devenir Un Artisan
            </a>
            <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-pink-500 to-pink-600 group-hover:w-full transition-all duration-300"></div>
          </li>
        </ul>
      </div>
      
      <!-- Desktop Action Buttons -->
      <div class="hidden lg:flex lg:items-center gap-x-3 xl:gap-x-4">
        <a routerLink="/register"
           class="flex items-center text-white/80 hover:text-white justify-center px-4 xl:px-6 py-2.5 font-medium text-base xl:text-lg transition-all duration-200 rounded-lg hover:bg-white/10">
          Sign up
        </a>
        <a routerLink="/login"
           class="flex items-center justify-center rounded-lg bg-gradient-to-r from-pink-600 to-pink-700 hover:from-pink-700 hover:to-pink-800 text-white px-4 xl:px-6 py-2.5 font-medium text-base xl:text-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl">
          Login
        </a>
      </div>
      
      <!-- Mobile Menu Button -->
      <div class="flex items-center lg:hidden">
        <button (click)="toggleMenu()" 
                class="p-2 rounded-lg text-white/80 hover:text-white hover:bg-white/10 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:ring-offset-2 focus:ring-offset-gray-800"
                [attr.aria-expanded]="isMenuOpen()"
                aria-label="Toggle navigation menu">
          <!-- Hamburger Icon -->
          <svg *ngIf="!isMenuOpen()" 
               stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 20 20" aria-hidden="true" 
               class="w-6 h-6 transition-transform duration-200" 
               xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM9 15a1 1 0 011-1h6a1 1 0 110 2h-6a1 1 0 01-1-1z" clip-rule="evenodd"></path>
          </svg>
          <!-- Close Icon -->
          <svg *ngIf="isMenuOpen()" 
               stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true" 
               class="w-6 h-6 transition-transform duration-200" 
               xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Enhanced Mobile Menu with Smooth Animation -->
    <div class="lg:hidden overflow-hidden transition-all duration-300 ease-in-out" 
         [class.max-h-0]="!isMenuOpen()"
         [class.max-h-screen]="isMenuOpen()"
         [class.opacity-0]="!isMenuOpen()"
         [class.opacity-100]="isMenuOpen()">
      <div class="border-t border-white/10 py-4 space-y-1 max-h-screen overflow-y-auto">
        <!-- Mobile Navigation Links -->
        <a routerLink="" 
           (click)="closeMenu()"
           class="block px-4 py-3 text-white/80 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200 transform hover:translate-x-1">
          Home
        </a>
        <a href="#" 
           (click)="closeMenu()"
           class="block px-4 py-3 text-white/80 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200 transform hover:translate-x-1">
          About
        </a>
        <a routerLink="/categories" 
           (click)="closeMenu()"
           class="block px-4 py-3 text-white/80 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200 transform hover:translate-x-1">
          Categories
        </a>
        <a routerLink="/register" 
           (click)="closeMenu()"
           class="block px-4 py-3 text-white/80 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200 transform hover:translate-x-1">
          Devenir Un Artisan
        </a>
        
        <!-- Mobile Action Buttons -->
        <div class="flex flex-col space-y-3 pt-4 border-t border-white/10 mt-4">
          <a routerLink="/register" 
             (click)="closeMenu()"
             class="flex items-center justify-center px-4 py-3 text-white/80 hover:text-white hover:bg-white/10 rounded-lg font-medium transition-all duration-200 border border-white/20 hover:border-white/40">
            <span class="mr-2">👤</span>
            Sign up
          </a>
          <a routerLink="/login" 
             (click)="closeMenu()"
             class="flex items-center justify-center px-4 py-3 bg-gradient-to-r from-pink-600 to-pink-700 hover:from-pink-700 hover:to-pink-800 text-white rounded-lg font-medium transition-all duration-200 shadow-lg transform hover:scale-105">
            <span class="mr-2">🔑</span>
            Login
          </a>
        </div>
      </div>
    </div>
  </nav>
</div>
