<div class="space-y-4">
  <div class="flex items-center gap-2">
    <input
      [ngModel]="q()"
      (ngModelChange)="q.set($event)"
      placeholder="Rechercher client (nom, email)…"
      class="w-full sm:w-96 rounded-md border border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-pink-600" />
    <button (click)="search()" class="rounded-md border border-gray-300 px-3 py-2 text-sm hover:bg-gray-50">
      Rechercher
    </button>
  </div>

  <div *ngIf="error()" class="rounded-md bg-rose-50 border border-rose-200 text-rose-700 px-3 py-2">
    {{ error() }}
  </div>

  <div class="overflow-auto rounded-xl border border-gray-200 bg-white">
    <table class="min-w-full text-left text-sm">
      <thead class="bg-gray-50 text-gray-600">
      <tr>
        <th class="px-4 py-3">Nom</th>
        <th class="px-4 py-3">Prénom</th>
        <th class="px-4 py-3">Email</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let c of (data()?.content ?? []); trackBy: trackById" class="border-t">
        <td class="px-4 py-3">{{ c.nom }}</td>
        <td class="px-4 py-3">{{ c.prenom }}</td>
        <td class="px-4 py-3">{{ c.email }}</td>
      </tr>

      <tr *ngIf="(data()?.content?.length ?? 0) === 0">
        <td colspan="3" class="px-4 py-6 text-center text-gray-500">Aucun résultat</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="flex items-center justify-between">
    <div class="text-sm text-gray-500">
      Page {{ page() }} / {{ totalPages() }} — {{ data()?.totalElements ?? 0 }} résultats
    </div>
    <div class="flex gap-2">
      <button (click)="prev()" class="rounded-md border border-gray-300 px-3 py-1 text-sm hover:bg-gray-50">Précédent</button>
      <button (click)="next()" class="rounded-md border border-gray-300 px-3 py-1 text-sm hover:bg-gray-50">Suivant</button>
      <select
        [ngModel]="pageSize()"
        (ngModelChange)="pageSize.set($event); page.set(1); search()"
        class="rounded-md border border-gray-300 bg-white px-3 py-1 text-sm">
        <option [ngValue]="5">5</option>
        <option [ngValue]="10">10</option>
        <option [ngValue]="20">20</option>
      </select>
    </div>
  </div>
</div>
