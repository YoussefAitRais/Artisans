<div class="p-4">
  <h2 class="text-xl font-bold mb-4">My Quotes</h2>

  <div class="grid gap-2 mb-6">
    <input class="bg-slate-800 rounded p-2" placeholder="Request ID" type="number"
           [(ngModel)]="model.requestId" />
    <input class="bg-slate-800 rounded p-2" placeholder="Price (MAD)" type="number"
           [(ngModel)]="model.price" />
    <input class="bg-slate-800 rounded p-2" placeholder="Estimated days"
           type="number" [(ngModel)]="model.estimatedDays" />
    <textarea class="bg-slate-800 rounded p-2" rows="3" placeholder="Message (optional)"
              [(ngModel)]="model.message"></textarea>
    <button class="bg-emerald-600 rounded px-4 py-2" (click)="create()">Create quote</button>
  </div>

  <div *ngIf="loading">Loading…</div>
  <div *ngIf="!loading && quotes.length === 0" class="text-slate-400">No quotes yet.</div>

  <div class="grid gap-3" *ngIf="!loading">
    <div *ngFor="let d of quotes" class="rounded border border-slate-700 p-3">
      <div class="font-medium">DV-{{ d.id }}</div>
      <div class="text-slate-300">Request #{{ d.requestId }}</div>
      <div class="font-semibold">{{ d.price }} MAD</div>
      <div *ngIf="d.estimatedDays">Est. {{ d.estimatedDays }} day(s)</div>
      <div class="text-slate-400" *ngIf="d.message">{{ d.message }}</div>
      <div class="text-xs mt-1">Status: {{ d.status }}</div>
    </div>
  </div>
</div>
