<div class="p-4">
  <h2 class="text-xl font-bold mb-4">Portfolio</h2>

  <input type="file" (change)="upload($event)" class="mb-4" />

  <div class="grid md:grid-cols-3 gap-3">
    <div *ngFor="let it of items" class="rounded overflow-hidden border border-slate-700">
      <img [src]="it.imageUrl" class="w-full h-40 object-cover" />
      <div class="p-2">
        <div class="font-medium">{{ it.title }}</div>
        <div class="text-slate-400 text-sm" *ngIf="it.description">{{ it.description }}</div>
      </div>
    </div>
  </div>
</div>
