<div class="flex items-center justify-between mb-3">
  <div class="font-semibold">Portfolio</div>
  <label class="px-3 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white cursor-pointer">
    Ajouter des photos
    <input type="file" (change)="upload($event)" class="hidden" />
  </label>
</div>
<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
  <img *ngFor="let p of items" [src]="p.url" class="w-full h-48 object-cover rounded-xl border border-slate-800 bg-slate-800/40" />
</div>
