<div class="p-4">
  <h2 class="text-xl font-bold mb-4">Availability</h2>

  <div class="grid md:grid-cols-2 gap-4">
    <!-- List -->
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
      <div class="font-semibold mb-2">My slots</div>

      <div *ngIf="loading">Loading…</div>
      <div *ngIf="!loading && slots.length === 0" class="text-slate-400 text-sm">No slots.</div>

      <div class="space-y-2" *ngIf="!loading">
        <div *ngFor="let s of slots" class="flex items-center justify-between border border-slate-800 rounded p-2">
          <div>
            <div class="font-medium">{{ dayLabel(s.dayOfWeek) }}</div>
            <div>De: <span class="font-semibold">{{ s.startTime }}</span></div>
            <div>À: <span class="font-semibold">{{ s.endTime }}</span></div>
          </div>
          <button class="rounded border border-gray-600 bg-gray-700 text-white hover:bg-gray-600 px-3 py-1" (click)="remove(s.id)">Delete</button>
        </div>
      </div>
    </div>

    <!-- Add -->
    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
      <div class="font-semibold mb-2">Add slot</div>

      <div class="grid gap-2">
        <select [(ngModel)]="draft.dayOfWeek" class="bg-slate-800 text-white border border-gray-600 rounded p-2">
          <option [ngValue]="1">Mon</option>
          <option [ngValue]="2">Tue</option>
          <option [ngValue]="3">Wed</option>
          <option [ngValue]="4">Thu</option>
          <option [ngValue]="5">Fri</option>
          <option [ngValue]="6">Sat</option>
          <option [ngValue]="7">Sun</option>
        </select>

        <input type="time" [(ngModel)]="draft.startTime" class="bg-slate-800 text-white border border-gray-600 rounded p-2" />
        <input type="time" [(ngModel)]="draft.endTime" class="bg-slate-800 text-white border border-gray-600 rounded p-2" />

        <button class="rounded bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2" (click)="add()">Add</button>
      </div>
    </div>
  </div>
</div>
