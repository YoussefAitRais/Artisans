<!-- 
  Artisan Dashboard Home - Tailwind CSS Version
  
  This template demonstrates:
  - Tailwind utility classes for responsive design
  - Clean semantic HTML structure
  - Accessibility features
  - Consistent spacing and colors
-->

<div class="p-6 bg-slate-900 min-h-screen text-white">
  <!-- Statistics Cards Section -->
  <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 mb-6">
    <div *ngFor="let stat of stats" 
         class="bg-slate-800 border border-slate-700 rounded-xl p-5 transition-all duration-200 hover:bg-slate-700 hover:-translate-y-0.5">
      <div class="text-sm text-slate-400 mb-2 font-medium">{{ stat.label }}</div>
      <div class="text-3xl font-bold text-white leading-tight">{{ stat.value }}</div>
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="grid gap-4 grid-cols-1 lg:grid-cols-2">
    <!-- Recent Reviews Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 text-white">
      <div class="text-lg font-semibold text-white mb-4">Avis récents</div>

      <!-- Reviews List (shows when we have reviews) -->
      <div *ngIf="recentReviews.length > 0; else emptyReviews">
        <div *ngFor="let review of recentReviews" 
             class="bg-slate-700 rounded-lg p-3 mb-3 last:mb-0 text-white">
          <div class="flex justify-between items-center mb-2">
            <div class="font-medium text-white text-sm">{{ review.author }}</div>
            <div class="text-amber-400 text-sm">
              {{ getStarRating(review.rating || 0) }}
            </div>
          </div>
          <div class="text-slate-300 text-sm leading-relaxed">{{ review.text }}</div>
        </div>
      </div>

      <!-- Empty State (shows when no reviews) -->
      <ng-template #emptyReviews>
        <div class="text-slate-400 text-sm text-center p-4 italic">
          Aucun avis pour le moment.
        </div>
      </ng-template>
    </div>

    <!-- Quick Actions Section -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 text-white">
      <div class="text-lg font-semibold text-white mb-4">Actions rapides</div>
      
      <div class="grid gap-3 grid-cols-1 sm:grid-cols-2">
        <a 
          routerLink="/artisan/requests" 
          class="block p-3 text-center text-white no-underline rounded-lg font-medium text-sm transition-all duration-200 bg-sky-600 hover:bg-sky-700 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-slate-800"
          aria-label="Voir toutes les demandes reçues"
        >
          Voir demandes
        </a>
        
        <a 
          routerLink="/artisan/quotes" 
          class="block p-3 text-center text-white no-underline rounded-lg font-medium text-sm transition-all duration-200 bg-emerald-600 hover:bg-emerald-700 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-slate-800"
          aria-label="Gérer mes devis envoyés"
        >
          Mes devis
        </a>
      </div>
    </div>
  </div>
</div>
