<!-- src/app/pages/artisan/requests/requests.component.html -->
<div class="p-5 space-y-4">
  <div class="text-xl font-semibold">Tableau de bord</div>

  <div *ngIf="error" class="rounded-lg bg-rose-600/20 border border-rose-700 p-3 text-rose-200">
    {{ error }}
  </div>

  <!-- Toolbar -->
  <div class="flex flex-wrap items-center gap-2">
    <input class="rounded-md border border-gray-600 bg-gray-800 text-white px-3 py-2 text-sm placeholder-gray-400"
           placeholder="Rechercher (id, titre, ville, ...)"
           [(ngModel)]="q" (keyup.enter)="onSearch()">
    <select class="rounded-md border border-gray-600 bg-gray-800 text-white px-3 py-2 text-sm"
            [(ngModel)]="status" (change)="onSearch()">
      <option [ngValue]="'ALL'">Tous</option>
      <option [ngValue]="'PENDING'">PENDING</option>
      <option [ngValue]="'RESPONDED'">RESPONDED</option>
    </select>
    <button class="rounded-md bg-slate-900 text-white px-4 py-2 text-sm" (click)="onSearch()">Rechercher</button>
    <button class="rounded-md border border-gray-600 bg-gray-700 text-white hover:bg-gray-600 px-4 py-2 text-sm" (click)="reset()">Réinitialiser</button>
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-slate-800 bg-slate-900/60 overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="text-left bg-slate-800/60">
      <tr>
        <th class="px-4 py-3">Titre</th>
        <th class="px-4 py-3">Ville</th>
        <th class="px-4 py-3">Souhaitée</th>
        <th class="px-4 py-3">Créée le</th>
        <th class="px-4 py-3">Statut</th>
        <th class="px-4 py-3">Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngIf="loading">
        <td colspan="6" class="px-4 py-6 text-center text-slate-400">Chargement…</td>
      </tr>

      <tr *ngFor="let r of rows; trackBy: trackById" class="border-t border-slate-800">
        <td class="px-4 py-3">{{ r.title }}</td>
        <td class="px-4 py-3">{{ r.city || '-' }}</td>
        <td class="px-4 py-3">{{ r.desiredDate || '—' }}</td>
        <td class="px-4 py-3">{{ r.createdAt | date:'yyyy-MM-dd HH:mm' }}</td>
        <td class="px-4 py-3">
          <span class="px-2 py-0.5 rounded text-xs" [ngClass]="badgeClass(r.status)">{{ r.status }}</span>
        </td>
        <td class="px-4 py-3 space-x-2">
          <!-- أمثلة لأزرار لاحقاً: عرض التفاصيل/إرسال عرض -->
          <button class="px-3 py-1 rounded border border-gray-600 bg-gray-700 text-white hover:bg-gray-600">Détails</button>
        </td>
      </tr>

      <tr *ngIf="!loading && rows.length === 0">
        <td colspan="6" class="px-4 py-6 text-center text-slate-400">Aucune demande</td>
      </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="flex items-center justify-between p-3">
      <div class="text-sm text-gray-500">
        Page {{ page + 1 }} / {{ totalPages }} — {{ total }} éléments
      </div>
      <div class="flex items-center gap-2">
        <button (click)="prev()" class="rounded-md border border-gray-600 bg-gray-700 text-white hover:bg-gray-600 px-3 py-1 text-sm">Précédent</button>
        <button (click)="next()" [disabled]="(page + 1) >= totalPages" class="rounded-md border border-gray-600 bg-gray-700 text-white hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed px-3 py-1 text-sm">Suivant</button>
        <select [ngModel]="size" (ngModelChange)="changeSize($event)" class="rounded-md border border-gray-600 bg-gray-800 text-white px-3 py-1 text-sm">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
          <option [ngValue]="20">20</option>
        </select>
      </div>
    </div>
  </div>
</div>
