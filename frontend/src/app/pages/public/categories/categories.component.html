<div class="max-w-3xl mx-auto p-6">
  <h2 class="text-xl font-semibold mb-4">Categories</h2>

  <div *ngIf="error" class="mb-3 p-2 rounded bg-rose-100 text-rose-700">{{ error }}</div>
  <div *ngIf="success" class="mb-3 p-2 rounded bg-emerald-100 text-emerald-700">{{ success }}</div>

  <div *ngIf="loading" class="text-slate-500">Loading…</div>

  <div class="grid gap-3" *ngIf="!loading">
    <div *ngFor="let c of items" class="rounded border p-3">
      <div class="font-medium">{{ c.name }}</div>
      <div class="text-slate-500 text-sm">{{ c.description || '—' }}</div>
    </div>
    <div *ngIf="items.length === 0" class="text-slate-400">No categories.</div>
  </div>
</div>
