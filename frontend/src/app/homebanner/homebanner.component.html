<!-- Enhanced Hero Section with Improved Responsive Design -->
<section class="relative bg-[#111827] text-white py-16 sm:py-20 lg:py-24 xl:py-28 overflow-hidden">

  <div class="absolute inset-0 bg-gradient-to-br from-gray-900/50 via-gray-800/30 to-pink-900/20"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 items-center gap-8 lg:gap-12 xl:gap-16">
      <!-- Left Content Section -->

        <!-- Main Heading with Enhanced Typography -->
        <div class="space-y-4">
          <h1 class="text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-bold leading-tight">
            <span class="block text-white">Trouvez Votre</span>
            <span class="block bg-gradient-to-r from-pink-400 to-pink-600 bg-clip-text text-transparent">Besoin.</span>
          </h1>
          <p class="text-gray-300 text-lg sm:text-xl lg:text-2xl font-medium max-w-lg">
            Meilleur Personne Meilleur Skill.
          </p>
        </div>

        <!-- Enhanced Search Bar -->
        <div class="relative group mt-8 lg:mt-10">
          <div class="absolute inset-0 bg-gradient-to-r from-pink-600 to-pink-700 rounded-full blur opacity-25 group-hover:opacity-40 transition-opacity duration-300"></div>
          <div class="relative">
            <input
              type="text"
              placeholder="Trouvez Votre Artisan..."
              class="w-full py-4 sm:py-5 lg:py-6 pl-6 lg:pl-8 pr-16 sm:pr-20 rounded-full text-gray-900 text-base sm:text-lg font-medium outline-none shadow-2xl border-2 border-transparent focus:border-pink-400 transition-all duration-300 placeholder-gray-500"
            />
            <button
              class="absolute top-1 right-1 bg-gradient-to-r from-pink-600 to-pink-700 hover:from-pink-700 hover:to-pink-800 text-white p-3 sm:p-4 lg:p-5 rounded-full transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-xl group"
            >
              <svg class="w-5 h-5 sm:w-6 sm:h-6 transition-transform duration-200 group-hover:scale-110" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

              </svg>
            </button>
          </div>
        </div>

        <!-- Enhanced Feature List with Better Mobile Layout -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 lg:gap-8 pt-6 lg:pt-8">
          <div class="flex items-center gap-3 p-3 rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 hover:bg-white/10 transition-all duration-200">
            <div class="flex-shrink-0 w-10 h-10 bg-blue-500/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M16.707 5.293a1 1 0 00-1.414 0L8 12.586 4.707 9.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l8-8a1 1 0 000-1.414z" />
              </svg>
            </div>
            <span class="font-medium text-white">Flexible</span>
          </div>
          <div class="flex items-center gap-3 p-3 rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 hover:bg-white/10 transition-all duration-200">
            <div class="flex-shrink-0 w-10 h-10 bg-green-500/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M16.707 5.293a1 1 0 00-1.414 0L8 12.586 4.707 9.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l8-8a1 1 0 000-1.414z" />
              </svg>
            </div>
            <span class="font-medium text-white">Learning path</span>
          </div>
          <div class="flex items-center gap-3 p-3 rounded-lg bg-white/5 backdrop-blur-sm border border-white/10 hover:bg-white/10 transition-all duration-200">
            <div class="flex-shrink-0 w-10 h-10 bg-purple-500/20 rounded-full flex items-center justify-center">
              <svg class="w-5 h-5 text-purple-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M16.707 5.293a1 1 0 00-1.414 0L8 12.586 4.707 9.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l8-8a1 1 0 000-1.414z" />
              </svg>
            </div>
            <span class="font-medium text-white">Community</span>
          </div>
        </div>
      </div>

      <!-- Right Image Section with Enhanced Effects -->
      <div class="lg:col-span-6 flex justify-center items-center relative mt-8 lg:mt-0">
        <div class="relative group">
          <!-- Background glow effect -->
          <div class="absolute inset-0 bg-gradient-to-r from-pink-600/20 to-blue-600/20 rounded-2xl blur-2xl opacity-75 group-hover:opacity-100 transition-opacity duration-300"></div>
          
          <!-- Main image with enhanced styling -->
          <div class="relative">
            <img src="assets/Images/artisans.jpg" alt="Professional Artisan at Work"
                 class="w-full max-w-sm sm:max-w-md lg:max-w-lg xl:max-w-xl rounded-2xl shadow-2xl relative z-10 transform transition-transform duration-300 group-hover:scale-105" />
            
            <!-- Decorative elements -->
            <div class="absolute -top-4 -right-4 w-8 h-8 bg-pink-600 rounded-full animate-ping opacity-75"></div>
            <div class="absolute -bottom-6 -left-6 w-12 h-12 bg-blue-600/20 rounded-full border-4 border-blue-600/50"></div>
          </div>
          
          <!-- Stats overlay card -->
          <div class="absolute -bottom-6 -right-6 bg-white/10 backdrop-blur-md rounded-xl p-4 border border-white/20 hidden sm:block">
            <div class="text-center">
              <div class="text-2xl font-bold text-white">1000+</div>
              <div class="text-sm text-gray-300">Artisans</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
