<!-- Full Page Shell (keeps your original split layout with Tailwind) -->
<div class="min-h-screen flex flex-col-reverse lg:flex-row w-full bg-[#111827] text-white">
  <!-- Left: Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12">
    <div class="w-full max-w-md">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-white">Artisan</h1>
        <p class="text-gray-300 mt-2">Log in to your account</p>
      </div>

      <!-- Login form with reactive forms -->
      <form class="mt-8 space-y-4 text-sm font-medium" 
            [formGroup]="loginForm"
            (ngSubmit)="onSubmit()">
        <div class="flex flex-col">
          <label class="mb-1">Email</label>
          <input formControlName="email" type="email"
                 class="bg-gray-700 text-white px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 [class.border-red-500]="getFieldError('email')"
                 placeholder="Enter your email address" />
          <div *ngIf="getFieldError('email')" class="text-red-400 text-xs mt-1">
            {{ getFieldError('email') }}
          </div>
        </div>

        <div class="flex flex-col">
          <label class="mb-1">Password</label>
          <input formControlName="password" type="password"
                 class="bg-gray-700 text-white px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 [class.border-red-500]="getFieldError('password')"
                 placeholder="Enter your password" />
          <div *ngIf="getFieldError('password')" class="text-red-400 text-xs mt-1">
            {{ getFieldError('password') }}
          </div>
        </div>

        <!-- Simple Error Display -->
        <div *ngIf="error" class="text-red-400 text-center bg-red-900/20 p-4 rounded-md border border-red-500/20">
          <div class="flex items-center justify-center mb-2">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span class="font-semibold">Login Error</span>
          </div>
          <div class="text-sm">{{ error }}</div>
        </div>

        <button type="submit" 
                [disabled]="loading || loginForm.invalid"
                class="w-full bg-blue-500 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-600 transition disabled:opacity-50">
          {{ loading ? 'Signing in…' : 'Log In' }}
        </button>

        <p class="text-center text-xs text-gray-400 mt-4">
          Don’t have an account?
          <a routerLink="/register" class="text-blue-400 hover:underline">Sign Up</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Right: illustration -->
  <div class="w-full lg:w-1/2 bg-gray-700 flex items-center justify-center p-4">
    <img src="https://storage.googleapis.com/devitary-image-host.appspot.com/15848031292911696601-undraw_designer_life_w96d.svg"
         alt="Login illustration" class="max-w-full h-auto" />
  </div>
</div>
